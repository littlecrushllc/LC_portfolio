<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Little Crush Films — Work</title>
    <link rel="stylesheet" href="styles.css?v=20" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">Little Crush Films</span>
        <span class="brand-sub">Work Library</span>
      </div>
      <div class="topbar-actions">
        <input
          id="search"
          class="search"
          type="search"
          placeholder="Search client or film…"
          autocomplete="off"
        />
        <button id="cabinetBtn" class="btn" title="Every award & nomination, grouped by client">🏆 Awards</button>
        <button id="scanBtn" class="btn btn-primary" title="Check Vimeo for films not yet in the library">⟳ Scan Vimeo</button>
      </div>
      <div class="grader-tools" id="graderTools" hidden>
        <input type="file" id="gradeFile" accept=".csv,text/csv" hidden />
        <button id="gradeImport" class="btn" title="Import grades from a CSV (film_id,stars)">Import grades</button>
        <button id="gradeExport" class="btn" title="Download your grades as CSV (private backup)">Export</button>
        <button id="gradePublish" class="btn btn-primary" title="Publish the ≥3★ selection + order to the public pages (no scores)">Publish featured</button>
      </div>
      <div class="sector-badge" id="sectorBadge" hidden>
        <button class="sector-badge-btn" id="sectorBadgeBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Browse other categories">
          <span id="sectorBadgeLabel"></span>
          <span class="sb-caret" aria-hidden="true">▾</span>
        </button>
        <div class="sector-menu" id="sectorMenu" role="menu" hidden></div>
      </div>
    </header>

    <section class="filters" id="filters">
      <div class="filter-group" id="filter-sector">
        <span class="filter-label">Sector</span>
        <div class="chips" data-group="sector"></div>
      </div>
      <div class="filter-group" id="filter-type">
        <span class="filter-label">Type</span>
        <div class="chips" data-group="videoType"></div>
      </div>
      <div class="filter-group" id="filter-client">
        <span class="filter-label">Client</span>
        <div class="chips" data-group="client"></div>
      </div>
      <div class="filter-meta">
        <span id="count" class="count"></span>
        <button id="shareBtn" class="btn btn-primary" title="Copy a paste-ready list of the shown films for an outreach email" hidden>⧉ Copy links</button>
        <button id="pickOnlyBtn" class="btn btn-ghost" title="Show only the films you've selected" hidden>Selected only</button>
        <button id="pickClearBtn" class="btn btn-ghost" title="Clear your selected films" hidden>Clear selection</button>
        <button id="clearBtn" class="btn btn-ghost" hidden>Clear filters</button>
      </div>
    </section>

    <main>
      <div id="grid" class="grid" aria-live="polite"></div>
      <div id="empty" class="empty" hidden>
        No films match those filters. <button class="linkbtn" id="emptyClear">Clear filters</button>
      </div>
    </main>

    <!-- Player modal -->
    <div id="playerModal" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-card player-card" role="dialog" aria-modal="true" aria-label="Film player">
        <button class="modal-close" data-close aria-label="Close">&times;</button>
        <div class="player-frame" id="playerFrame"></div>
        <div class="player-meta">
          <div>
            <div class="player-client" id="playerClient"></div>
            <div class="player-film" id="playerFilm"></div>
          </div>
          <div class="player-actions">
            <button id="editFilm" class="btn">Edit</button>
            <button id="copyLink" class="btn btn-primary">Copy private link</button>
          </div>
        </div>
        <div class="player-grade" id="playerGrade" hidden></div>
        <div class="player-sub" id="playerSub" hidden></div>
        <div class="player-awards" id="playerAwards" hidden></div>
      </div>
    </div>

    <!-- Add-film modal -->
    <div id="addModal" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-card add-card" role="dialog" aria-modal="true" aria-label="Add a film">
        <button class="modal-close" data-close aria-label="Close">&times;</button>
        <h2 class="add-title" id="addTitle">Add a film</h2>
        <p class="add-hint" id="addModeHint"></p>

        <div id="addPreview" class="add-preview" hidden>
          <img id="addThumb" alt="" />
          <div class="add-fields">
            <label class="field">
              <span>Film</span>
              <input id="addFilm" type="text" />
            </label>
            <div class="field">
              <span>Client <small>· pick any that apply</small></span>
              <div class="pick" id="pickClient"></div>
              <div class="field-row">
                <input id="newClient" type="text" placeholder="Add a client…" />
                <button type="button" id="addClientBtn" class="btn">Add</button>
              </div>
            </div>
            <div class="field">
              <span>Sectors <small>· pick any that apply</small></span>
              <div class="pick" id="pickSector"></div>
              <div class="field-row">
                <input id="newSector" type="text" placeholder="Add a sector…" />
                <button type="button" id="addSectorBtn" class="btn">Add</button>
              </div>
            </div>
            <div class="field">
              <span>Video types <small>· pick any that apply</small></span>
              <div class="pick" id="pickType"></div>
              <div class="field-row">
                <input id="newType" type="text" placeholder="Add a type…" />
                <button type="button" id="addTypeBtn" class="btn">Add</button>
              </div>
            </div>
            <label class="field">
              <span>Description <small>· from Vimeo; shown on the player</small></span>
              <textarea id="addDesc" rows="3"></textarea>
            </label>
            <div class="field">
              <span>Our grade <small>· internal only — never shown to clients or on the player</small></span>
              <div class="edit-grade" id="editGrade"></div>
            </div>
          </div>
        </div>

        <p class="add-error" id="addError" hidden></p>

        <div class="add-actions">
          <button id="refreshThumb" class="btn" hidden>↻ Refresh thumb</button>
          <button id="skipFilm" class="btn" hidden>Skip</button>
          <button id="saveFilm" class="btn btn-primary" disabled>Save film</button>
        </div>
      </div>
    </div>

    <!-- Awards cabinet (all awards, grouped by client) -->
    <div id="cabinetModal" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-card cabinet-card" role="dialog" aria-modal="true" aria-label="Awards">
        <button class="modal-close" data-close aria-label="Close">&times;</button>
        <div class="cabinet-head">
          <div>
            <h2 class="cabinet-title">🏆 Awards &amp; nominations</h2>
            <p class="cabinet-count" id="cabinetCount"></p>
          </div>
          <button id="cabinetCopy" class="btn">⧉ Copy all</button>
        </div>
        <div class="cabinet-list" id="cabinetList"></div>
      </div>
    </div>

    <!-- Per-film awards manager -->
    <div id="awardsModal" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-card awards-card" role="dialog" aria-modal="true" aria-label="Manage awards">
        <button class="modal-close" data-close aria-label="Close">&times;</button>
        <h2 class="add-title">Awards</h2>
        <p class="add-hint" id="awardsFilmLabel"></p>
        <div class="awards-list" id="awardsList"></div>
        <div class="awards-add">
          <div class="aw-form-row">
            <input id="awBody" type="text" placeholder="Award body (e.g. The Telly Awards)" />
            <select id="awTier">
              <option>Gold</option><option>Silver</option><option>Bronze</option>
              <option selected>Winner</option><option>Finalist</option><option>Nominee</option>
              <option>Excellence</option><option>Distinction</option><option>Merit</option>
              <option>Grand Winner</option>
            </select>
            <input id="awYear" type="number" placeholder="Year" class="aw-year" />
          </div>
          <input id="awTitle" type="text" placeholder="Category / title (optional) — e.g. GOLD: General B2B" />
          <button id="awAdd" class="btn btn-primary">+ Add award</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="data.js?v=17"></script>
    <script src="app.js?v=24"></script>
  </body>
</html>
